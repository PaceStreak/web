# Deploy the landing page to Cloudflare Pages on every push to main.
#
# The Pages project is a DIRECT UPLOAD project, not Git-connected. Cloudflare
# cannot convert an existing direct-upload project to a Git-integrated one — you
# would have to create a second project and move the custom domains across,
# which means downtime on a live apex. Deploying from Actions instead keeps the
# existing project, its domains and its certificates untouched.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   Account > Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID  already set

name: Deploy

on:
  push:
    branches: [main]
    # Documentation does not change what is served, so it does not need a
    # deploy. Everything else does.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".markdownlint.json"
  workflow_dispatch:

# Never let two deploys race; a later push should win.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag. Tags are
      # mutable — whoever controls the action repo can repoint v6 at malicious
      # code, and this job holds a Cloudflare deploy token.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # This job never pushes. Leaving credentials in .git/config would
          # expose the token to anything else in the container.
          persist-credentials: false

      # This is the whole reason the deploy is automated. Asset filenames carry
      # no content hash and Cloudflare serves /assets/* with a multi-hour
      # Cache-Control that _headers cannot override, so an unstamped deploy
      # ships new markup against a stale stylesheet — silently, for hours.
      # Doing it here means it cannot be forgotten.
      - name: Stamp asset URLs with content hashes
        run: python3 stamp.py

      - name: Fail if stamping changed nothing it should have
        run: |
          if ! grep -qE '/assets/styles\.css\?v=[0-9a-f]{8}' index.html; then
            echo "::error::index.html has no stamped stylesheet URL — stamp.py did not run correctly"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.120.1 pages deploy . \
            --project-name=pacestreak \
            --branch=main \
            --commit-dirty=true

      # A green deploy step only means the upload succeeded. Check the site
      # actually serves, so a broken deploy fails here rather than being found
      # by a visitor.
      - name: Verify the live site
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' https://www.pacestreak.com/ || echo 000)
            redirect=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' https://pacestreak.com/ || echo 000)
            echo "attempt $i: www=$code apex=$redirect"
            if [ "$code" = "200" ] && [ "$redirect" = "301" ]; then
              echo "live site healthy"
              exit 0
            fi
            sleep 15
          done
          echo "::error::site did not come back healthy after deploy"
          exit 1
